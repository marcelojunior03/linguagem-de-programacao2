<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Calculadora</title>
</head>

<body>

    <h1>Calculadora</h1>

    <form action="calculadora" method="post">

        <label>Valor 1:</label>
        <input type="text" name="valor1">

        <br><br>

        <label>Valor 2:</label>
        <input type="text" name="valor2">

        <br><br>

        <label>Operação:</label>

        <select name="operacao">

            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
            <option value="%">%</option>

        </select>

        <br><br>

        <input type="submit" value="Calcular">

    </form>

</body>

</html>
